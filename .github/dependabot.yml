version: 2
updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"

  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
    ignore:
      # pytest and pytest-asyncio are pinned by pytest-homeassistant-custom-component,
      # which requires an exact pytest. Bumping them independently made
      # requirements_test.txt unresolvable and broke CI. Upgrade them only together
      # with a phcc release that supports the newer version.
      - dependency-name: "pytest"
      - dependency-name: "pytest-asyncio"
