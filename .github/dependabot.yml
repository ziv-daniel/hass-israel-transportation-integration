version: 2
updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"

  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
    ignore:
      # pytest, pytest-asyncio and pytest-cov are pinned exactly by
      # pytest-homeassistant-custom-component. Giving them our own floors made
      # requirements_test.txt unresolvable twice, so they are unconstrained in
      # requirements_test.txt and phcc decides. Nothing for dependabot to do.
      - dependency-name: "pytest"
      - dependency-name: "pytest-asyncio"
      - dependency-name: "pytest-cov"
