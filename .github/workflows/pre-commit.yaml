name: Pre-commit

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || '["self-hosted","linux","x64","homelab"]') }}
    timeout-minutes: 30
    name: Run pre-commit checks
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@v7"

      - name: "Set up Python"
        uses: "actions/setup-python@v7"
        with:
          python-version: "3.12"

      - name: "Run pre-commit"
        uses: pre-commit/action@v3.0.1
