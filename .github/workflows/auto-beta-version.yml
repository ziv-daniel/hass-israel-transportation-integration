name: Auto Beta Version

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  beta-version:
    runs-on: ubuntu-latest
    # Only run if tests passed
    needs: []  # Will run independently, but tests should pass first

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Need full history to count commits
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Get current version and calculate beta version
        id: version
        run: |
          CURRENT_VERSION=$(python scripts/get_version.py)
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Check if current version is already a beta
          if [[ $CURRENT_VERSION == *"-beta."* ]]; then
            # Extract base version and beta number
            BASE_VERSION=$(echo $CURRENT_VERSION | cut -d'-' -f1)
            BETA_NUM=$(echo $CURRENT_VERSION | cut -d'.' -f4)
            NEW_BETA_NUM=$((BETA_NUM + 1))
            NEW_VERSION="$BASE_VERSION-beta.$NEW_BETA_NUM"
          else
            # Current is stable, bump patch and start beta.1
            IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
            MAJOR=${VERSION_PARTS[0]}
            MINOR=${VERSION_PARTS[1]}
            PATCH=${VERSION_PARTS[2]}
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH-beta.1"
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumping from $CURRENT_VERSION to $NEW_VERSION"

      - name: Update version in manifest.json
        run: |
          python scripts/bump_version.py ${{ steps.version.outputs.new_version }}

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add custom_components/israel_transportation/manifest.json

          git commit -m "chore: Bump version to ${{ steps.version.outputs.new_version }}

          Auto-incremented beta version for testing.

          🤖 Automated version bump" || echo "No changes to commit"

          git push

      - name: Create Pre-release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          release_name: v${{ steps.version.outputs.new_version }} (Beta)
          body: |
            ## 🧪 Beta Release - Testing Only

            **This is a pre-release version for development and testing.**

            ⚠️ **Not recommended for production use**

            ### Version
            - Current: `${{ steps.version.outputs.new_version }}`
            - Previous: `${{ steps.version.outputs.current_version }}`

            ### For Developers
            This beta version is automatically created for testing purposes.
            Install via:
            - Local symlink to Home Assistant
            - HACS custom repository (private repo)

            ### Stability
            This version may contain:
            - 🐛 Unfixed bugs
            - 🔬 Experimental features
            - 📝 Incomplete documentation

            ---
            🤖 Automated beta release
          draft: false
          prerelease: true  # Mark as pre-release
