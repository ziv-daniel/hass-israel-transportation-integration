name: HACS Validation

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || '["self-hosted","linux","x64","homelab"]') }}
    timeout-minutes: 30
    name: Validate
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@v7"

      - name: "Run HACS validation"
        uses: "hacs/action@main"
        with:
          category: "integration"
