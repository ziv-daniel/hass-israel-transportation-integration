name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    name: Python ${{ matrix.python-version }}
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@v7"

      - name: "Set up Python ${{ matrix.python-version }}"
        uses: "actions/setup-python@v6"
        with:
          python-version: ${{ matrix.python-version }}

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: "Run tests with pytest"
        run: |
          pytest tests/ \
            --cov=custom_components.israel_transportation \
            --cov-report=term-missing \
            --cov-fail-under=70

  quality:
    runs-on: ubuntu-latest
    name: Quality checks (mypy + bandit)
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@v7"

      - name: "Set up Python"
        uses: "actions/setup-python@v6"
        with:
          python-version: "3.13"

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: "manifest requirements match requirements_test.txt"
        run: |
          python - <<'EOF'
          import json, re, sys

          # Dependabot's pip ecosystem only watches requirements*.txt, never
          # manifest.json, so the runtime pin silently drifts from what CI tests.
          manifest = json.load(
              open("custom_components/israel_transportation/manifest.json")
          )
          pinned = {}
          for req in manifest["requirements"]:
              m = re.match(r"^([A-Za-z0-9_.-]+)==(.+)$", req)
              if m:
                  pinned[m.group(1).lower()] = m.group(2)

          tested = {}
          for line in open("requirements_test.txt"):
              line = line.split("#")[0].strip()
              m = re.match(r"^([A-Za-z0-9_.-]+)==(.+)$", line)
              if m:
                  tested[m.group(1).lower()] = m.group(2)

          bad = [
              f"  {name}: manifest pins {ver}, requirements_test.txt has {tested[name]}"
              for name, ver in pinned.items()
              if name in tested and tested[name] != ver
          ]
          if bad:
              print("Runtime and test dependency pins disagree:")
              print("\n".join(bad))
              sys.exit(1)
          print(f"OK: {len(pinned)} pinned requirement(s) agree")
          EOF

      - name: "mypy type check"
        run: |
          mypy custom_components/israel_transportation \
            --ignore-missing-imports \
            --no-error-summary \
            --follow-imports=silent
        continue-on-error: true

      - name: "bandit security scan"
        run: |
          bandit -r custom_components/israel_transportation \
            -ll \
            --exclude custom_components/israel_transportation/gtfs_data
