name: Validate with hassfest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || '["self-hosted","linux","x64","homelab"]') }}
    timeout-minutes: 30
    name: With hassfest
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@v7"

      - name: "Run hassfest validation"
        uses: "home-assistant/actions/hassfest@master"
