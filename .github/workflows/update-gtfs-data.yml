name: Update GTFS Station Data

on:
  schedule:
    # Run every 3 days at 2:00 AM UTC
    - cron: '0 2 */3 * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update-gtfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install aiohttp

      - name: Download and parse GTFS data
        id: update_gtfs
        run: |
          python scripts/update_gtfs_data.py

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet custom_components/silent_bus/gtfs_data/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected in GTFS data"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in GTFS data"
          fi

      - name: Get current version
        if: steps.check_changes.outputs.has_changes == 'true'
        id: get_version
        run: |
          CURRENT_VERSION=$(python scripts/get_version.py)
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Bump patch version (e.g., 1.3.1 -> 1.3.2)
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update version in manifest.json
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          python scripts/bump_version.py ${{ steps.get_version.outputs.new_version }}

      - name: Update CHANGELOG.md
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          python scripts/update_changelog.py \
            --version ${{ steps.get_version.outputs.new_version }} \
            --message "Automated GTFS station data update"

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add custom_components/silent_bus/gtfs_data/
          git add custom_components/silent_bus/manifest.json
          git add CHANGELOG.md

          git commit -m "chore: Update GTFS station data to v${{ steps.get_version.outputs.new_version }}

          - Downloaded latest Israeli government GTFS data
          - Updated station list and city index
          - Auto-generated by GitHub Actions

          🤖 Automated update"

          git push

      - name: Create Release
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get_version.outputs.new_version }}
          release_name: v${{ steps.get_version.outputs.new_version }} - GTFS Data Update
          body: |
            ## Automated GTFS Station Data Update

            This release contains updated Israeli public transit station data from the Ministry of Transport.

            ### Changes
            - 🔄 Updated GTFS station data (downloaded ${{ github.event.repository.updated_at }})
            - 📍 Station count: ~30,000
            - 🏙️ Cities covered: All major Israeli cities

            ### Data Source
            - Government GTFS: https://gtfs.mot.gov.il
            - License: CDLA-Permissive-1.0

            ---
            🤖 This release was automatically generated by GitHub Actions
          draft: false
          prerelease: false

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::GTFS update workflow failed. Manual intervention may be required."
