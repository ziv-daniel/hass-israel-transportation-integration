name: Update GTFS Station Data

on:
  schedule:
    # Run every 3 days at 2:00 AM UTC
    - cron: '0 2 */3 * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-gtfs-data.yml'

permissions:
  contents: write

jobs:
  update-gtfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install aiohttp

      - name: Download and parse GTFS data
        run: python scripts/update_gtfs_data.py

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet custom_components/israel_transportation/gtfs_data/cities_index.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes in GTFS data — skipping asset update"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected — will update gtfs-data-latest release assets"
          fi

      - name: Ensure gtfs-data-latest release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view gtfs-data-latest &>/dev/null; then
            gh release create gtfs-data-latest \
              --title "GTFS Station Data (auto-updated)" \
              --notes "Auto-updated GTFS station data from gtfs.mot.gov.il (CDLA-Permissive-1.0). Updated every few days." \
              --prerelease
            echo "Created gtfs-data-latest release"
          else
            echo "gtfs-data-latest release already exists"
          fi

      - name: Upload updated assets to gtfs-data-latest
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload gtfs-data-latest \
            custom_components/israel_transportation/gtfs_data/cities_index.json \
            custom_components/israel_transportation/gtfs_data/routes_index.json.gz \
            --clobber
          echo "Assets updated on gtfs-data-latest"

      - name: Bootstrap assets on first run (if release was just created)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Upload current assets if none exist yet on the release
          ASSETS=$(gh release view gtfs-data-latest --json assets --jq '.assets | length')
          if [ "$ASSETS" -eq 0 ]; then
            echo "No assets on release yet — uploading current data as bootstrap"
            gh release upload gtfs-data-latest \
              custom_components/israel_transportation/gtfs_data/cities_index.json \
              custom_components/israel_transportation/gtfs_data/routes_index.json.gz \
              --clobber
            echo "Bootstrap complete"
          else
            echo "Release already has $ASSETS assets — nothing to bootstrap"
          fi

      - name: Notify on failure
        if: failure()
        run: echo "::warning::GTFS update workflow failed. Manual intervention may be required."
