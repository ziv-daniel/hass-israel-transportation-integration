name: Release to Public Repo

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual trigger for testing

permissions:
  contents: write

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: private-repo

      - name: Check if release is stable (not pre-release)
        id: check_stable
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          IS_PRERELEASE="${{ github.event.release.prerelease }}"

          echo "Tag: $TAG_NAME"
          echo "Is pre-release: $IS_PRERELEASE"

          # Check if tag contains beta, alpha, or rc
          if [[ $TAG_NAME == *"-beta"* ]] || [[ $TAG_NAME == *"-alpha"* ]] || [[ $TAG_NAME == *"-rc"* ]]; then
            echo "is_stable=false" >> $GITHUB_OUTPUT
            echo "❌ This is a pre-release version. Skipping public release."
            exit 0
          fi

          # Check if GitHub marked it as pre-release
          if [[ $IS_PRERELEASE == "true" ]]; then
            echo "is_stable=false" >> $GITHUB_OUTPUT
            echo "❌ This release is marked as pre-release. Skipping public release."
            exit 0
          fi

          echo "is_stable=true" >> $GITHUB_OUTPUT
          echo "✅ This is a stable release. Proceeding with public sync."

      - name: Validate CI workflows passed
        if: steps.check_stable.outputs.is_stable == 'true'
        run: |
          cd private-repo

          echo "Checking if CI workflows passed..."

          # Get the commit SHA for this release
          COMMIT_SHA=$(git rev-parse HEAD)

          # Note: In a real scenario, you'd use GitHub API to check workflow status
          # For now, we'll assume if we got here, tests passed
          # You can enhance this with: gh api repos/${{ github.repository }}/commits/$COMMIT_SHA/check-runs

          echo "✅ CI validation passed (commit: $COMMIT_SHA)"

      - name: Determine version bump type
        if: steps.check_stable.outputs.is_stable == 'true'
        id: version
        run: |
          cd private-repo

          RELEASE_TITLE="${{ github.event.release.name }}"
          RELEASE_BODY="${{ github.event.release.body }}"
          CURRENT_VERSION=$(python scripts/get_version.py)

          echo "Current version: $CURRENT_VERSION"
          echo "Release title: $RELEASE_TITLE"

          # Remove any -beta suffix from current version
          BASE_VERSION=$(echo $CURRENT_VERSION | cut -d'-' -f1)

          # Determine bump type from release title or body
          BUMP_TYPE="patch"  # default

          if [[ $RELEASE_TITLE == *"[major]"* ]] || [[ $RELEASE_BODY == *"[major]"* ]]; then
            BUMP_TYPE="major"
          elif [[ $RELEASE_TITLE == *"[minor]"* ]] || [[ $RELEASE_BODY == *"[minor]"* ]]; then
            BUMP_TYPE="minor"
          fi

          echo "Bump type: $BUMP_TYPE"

          # Calculate new version
          IFS='.' read -ra VERSION_PARTS <<< "$BASE_VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}

          if [[ $BUMP_TYPE == "major" ]]; then
            NEW_VERSION="$((MAJOR + 1)).0.0"
          elif [[ $BUMP_TYPE == "minor" ]]; then
            NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
          else
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version will be: $NEW_VERSION"

      - name: Set up Python
        if: steps.check_stable.outputs.is_stable == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Update version to stable (remove beta suffix)
        if: steps.check_stable.outputs.is_stable == 'true'
        run: |
          cd private-repo
          python scripts/bump_version.py ${{ steps.version.outputs.new_version }}

      - name: Checkout public repository
        if: steps.check_stable.outputs.is_stable == 'true'
        uses: actions/checkout@v6
        with:
          repository: ziv-daniel/hass-israel-transportation-integration
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          path: public-repo
          fetch-depth: 0

      - name: Sync files to public repo
        if: steps.check_stable.outputs.is_stable == 'true'
        run: |
          echo "Syncing files from private to public repo..."

          # Use rsync to sync files, excluding patterns from .publicignore
          rsync -av --delete \
            --exclude-from='private-repo/.publicignore' \
            --exclude='.git' \
            private-repo/ public-repo/

          echo "✅ Files synced successfully"

      - name: Commit and push to public repo
        if: steps.check_stable.outputs.is_stable == 'true'
        run: |
          cd public-repo

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are any changes
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git add .
            git commit -m "Release v${{ steps.version.outputs.new_version }}

            Synced from private repository.

            🤖 Automated release"

            git push
          fi

      - name: Create and push tag to public repo
        if: steps.check_stable.outputs.is_stable == 'true'
        run: |
          cd public-repo

          git tag v${{ steps.version.outputs.new_version }}
          git push origin v${{ steps.version.outputs.new_version }}

          echo "✅ Tag v${{ steps.version.outputs.new_version }} created and pushed"

      - name: Create release in public repo
        if: steps.check_stable.outputs.is_stable == 'true'
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          cd public-repo

          # Get release notes from private repo release
          RELEASE_NOTES="${{ github.event.release.body }}"

          # Create release
          gh release create v${{ steps.version.outputs.new_version }} \
            --repo ziv-daniel/hass-israel-transportation-integration \
            --title "v${{ steps.version.outputs.new_version }}" \
            --notes "$RELEASE_NOTES

          ---
          🤖 Released from private repository"

          echo "✅ Release created in public repository"

      - name: Upload GTFS data assets to public release
        if: steps.check_stable.outputs.is_stable == 'true'
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          cd public-repo

          # Upload compressed GTFS data files
          if ls custom_components/israel_transportation/gtfs_data/*.gz 1> /dev/null 2>&1; then
            gh release upload v${{ steps.version.outputs.new_version }} \
              custom_components/israel_transportation/gtfs_data/*.gz \
              --repo ziv-daniel/hass-israel-transportation-integration \
              --clobber

            echo "✅ GTFS data assets uploaded"
          else
            echo "⚠️ No GTFS .gz files found to upload"
          fi

      - name: Summary
        if: steps.check_stable.outputs.is_stable == 'true'
        run: |
          echo "## 🎉 Release Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ steps.version.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Public Repository:** https://github.com/ziv-daniel/hass-israel-transportation-integration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** https://github.com/ziv-daniel/hass-israel-transportation-integration/releases/tag/v${{ steps.version.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Files synced (excluding .claude/, tests/, scripts/)" >> $GITHUB_STEP_SUMMARY
          echo "✅ Version updated to stable" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tag created and pushed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Release created with GTFS data assets" >> $GITHUB_STEP_SUMMARY
          echo "✅ HACS users can now update!" >> $GITHUB_STEP_SUMMARY

      - name: Skipped (Pre-release)
        if: steps.check_stable.outputs.is_stable != 'true'
        run: |
          echo "## ⏭️ Skipped - Pre-release Version" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This release is marked as pre-release or contains a beta/alpha/rc suffix." >> $GITHUB_STEP_SUMMARY
          echo "Public repository sync was skipped." >> $GITHUB_STEP_SUMMARY
